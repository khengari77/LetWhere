[project]
name = "letwhere"
version = "0.1.0"
description = "A functional language demonstrating PyParsec features."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyparsec",
]

[project.scripts]
letwhere = "letwhere.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/letwhere"]

[tool.uv.sources]
pyparsec = { git = "https://github.com/khengari77/PyParsec.git" }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
